<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BYTE BEASTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a1a;
  --shell:#2b2f45;
  --shell-dark:#1a1d2e;
  --screen:#0d1830;
  --cyan:#4dfff2;
  --magenta:#ff3fa4;
  --amber:#ffc23c;
  --green:#39ff88;
  --red:#ff4d5e;
  --text:#dff4ff;
  --dim:#5a7089;
  --font-display:'Press Start 2P', monospace;
  --font-body:'Space Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:transparent; font-family:var(--font-body); color:var(--text);}
button{font-family:var(--font-body); cursor:pointer;}
.app{
  width:100%; max-width:480px; margin:0 auto; padding:18px 14px 28px;
  display:flex; flex-direction:column; align-items:center; gap:12px;
}
.header{
  font-family:var(--font-display); font-size:11px; letter-spacing:2px;
  color:var(--cyan); text-shadow:0 0 8px rgba(77,255,242,.5);
  display:flex; align-items:center; gap:10px;
}
.header .dot{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 6px var(--green); animation:blink 1.6s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* device shell */
.device{
  width:100%; background:linear-gradient(160deg,var(--shell),var(--shell-dark));
  border-radius:26px; padding:16px; box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.05);
}
.screen{
  position:relative; background:radial-gradient(ellipse at 50% -10%, #123055, var(--screen) 60%);
  border-radius:14px; padding:14px; min-height:360px; overflow:hidden;
  border:2px solid #061022; box-shadow:inset 0 0 30px rgba(0,0,0,.6), inset 0 0 3px rgba(77,255,242,.3);
}
.scanlines{
  position:absolute; inset:0; pointer-events:none; z-index:5;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 1px, transparent 2px, transparent 3px);
  mix-blend-mode:overlay;
}
.screen-glow{position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 40px rgba(77,255,242,.08); z-index:6;}

/* ---------- title ---------- */
.title-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; height:332px; gap:18px; text-align:center;}
.title-logo{font-family:var(--font-display); font-size:20px; color:var(--cyan); text-shadow:0 0 12px var(--cyan), 0 0 2px #fff; line-height:1.6;}
.title-logo span{color:var(--magenta); text-shadow:0 0 12px var(--magenta);}
.title-sub{font-size:11px; color:var(--dim); letter-spacing:1px;}
.egg-icon{width:56px; height:64px; border-radius:50% 50% 46% 46%/56% 56% 44% 44%; background:linear-gradient(160deg,var(--amber),#a05d1c); box-shadow:0 0 22px rgba(255,194,60,.5); position:relative; animation:float 3s ease-in-out infinite;}
.egg-icon::after{content:''; position:absolute; inset:8px; border-radius:50%; background:repeating-linear-gradient(45deg, rgba(255,255,255,.15) 0 4px, transparent 4px 8px);}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.name-input{
  font-family:var(--font-body); font-size:13px; background:var(--shell-dark); border:1px solid var(--cyan);
  color:var(--text); padding:9px 12px; border-radius:8px; text-align:center; width:200px; outline:none;
}
.name-input::placeholder{color:var(--dim);}
.btn{
  font-family:var(--font-display); font-size:10px; letter-spacing:1px; padding:11px 16px; border-radius:9px;
  border:none; color:#04121a; background:linear-gradient(160deg,var(--cyan),#1fa8c9); box-shadow:0 3px 0 #0d6d84, 0 6px 14px rgba(0,0,0,.35);
  transition:transform .08s ease;
}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 #0d6d84;}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn.magenta{background:linear-gradient(160deg,var(--magenta),#a01c62); box-shadow:0 3px 0 #6e0f42, 0 6px 14px rgba(0,0,0,.35); color:#1a020f;}
.btn.amber{background:linear-gradient(160deg,var(--amber),#a8721b); box-shadow:0 3px 0 #6e4a0f; color:#1f1200;}
.btn.ghost{background:transparent; border:1px solid var(--dim); color:var(--dim); box-shadow:none;}
.btn.small{font-size:8px; padding:8px 10px;}

/* ---------- home ---------- */
.home-screen{display:flex; flex-direction:column; gap:10px; height:100%;}
.stat-row{display:flex; justify-content:space-between; align-items:center; font-size:10px; color:var(--dim);}
.stat-row .name{font-family:var(--font-display); font-size:9px; color:var(--text); letter-spacing:1px;}
.bars{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
.bar-label{display:flex; justify-content:space-between; font-size:8px; color:var(--dim); margin-bottom:2px;}
.bar-track{height:9px; background:#050a16; border-radius:5px; overflow:hidden; border:1px solid rgba(255,255,255,.06);}
.bar-fill{height:100%; border-radius:5px; transition:width .5s ease;}
.bar-fill.hp{background:linear-gradient(90deg,#ff4d5e,#ff9a5e);}
.bar-fill.xp{background:linear-gradient(90deg,#4dfff2,#3f9dff);}
.bar-fill.energy{background:linear-gradient(90deg,#ffc23c,#ffe08a);}
.bar-fill.affection{background:linear-gradient(90deg,#ff3fa4,#ff9fd0);}

.stage-arena{display:flex; align-items:center; justify-content:center; height:150px; position:relative;}
.creature-sprite{position:relative; transition:transform .3s;}
.body-blob{border-radius:46% 54% 52% 48%/56% 48% 52% 44%; position:relative; box-shadow:0 8px 24px rgba(0,0,0,.4);}
.eyes{position:absolute; top:38%; left:50%; transform:translateX(-50%); display:flex; gap:14px;}
.eye{width:9px; height:11px; background:#0c1526; border-radius:50%; position:relative;}
.eye::after{content:''; position:absolute; width:3px; height:3px; background:#fff; border-radius:50%; top:2px; left:2px; opacity:.85;}
.limb{position:absolute; border-radius:40%; background:inherit; filter:brightness(.85);}
.spike{position:absolute; width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent;}
.particle{position:absolute; border-radius:50%; opacity:.7; animation:drift 2.4s ease-in-out infinite;}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-10px);opacity:.2}}

/* stage sizing */
.stage-spore .body-blob{width:52px;height:46px;}
.stage-larva .body-blob{width:66px;height:56px;}
.stage-cadet .body-blob{width:82px;height:70px;}
.stage-vanguard .body-blob{width:100px;height:86px;}
.stage-apex .body-blob{width:120px;height:100px;}

/* element colors */
.el-EMBER .body-blob{background:linear-gradient(155deg,#ff8a5c,#e0421f); box-shadow:0 8px 24px rgba(224,66,31,.4), 0 0 24px rgba(255,138,92,.25);}
.el-TORRENT .body-blob{background:linear-gradient(155deg,#5fd8ff,#0f6fb8); box-shadow:0 8px 24px rgba(15,111,184,.4), 0 0 24px rgba(95,216,255,.25);}
.el-VERDANT .body-blob{background:linear-gradient(155deg,#8dfa8d,#1f8f3f); box-shadow:0 8px 24px rgba(31,143,63,.4), 0 0 24px rgba(141,250,141,.25);}
.el-VOLT .body-blob{background:linear-gradient(155deg,#fff08a,#e0a91f); box-shadow:0 8px 24px rgba(224,169,31,.4), 0 0 24px rgba(255,240,138,.25);}

.log-panel{
  background:#050a16; border-radius:8px; padding:8px 10px; font-size:9.5px; color:var(--cyan);
  height:56px; overflow-y:auto; border:1px solid rgba(255,255,255,.05); line-height:1.6;
}
.log-panel .old{color:var(--dim);}

.action-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:2px;}

/* ---------- battle ---------- */
.battle-screen{display:flex; flex-direction:column; gap:8px; height:100%;}
.vs-row{display:flex; justify-content:space-between; align-items:flex-end; padding:6px 4px 0;}
.combatant{display:flex; flex-direction:column; align-items:center; gap:4px; width:46%;}
.combatant .cname{font-size:9px; color:var(--text);}
.combatant .lvl{font-size:8px; color:var(--dim);}
.mini-bar{width:100%; height:7px; background:#050a16; border-radius:4px; overflow:hidden; border:1px solid rgba(255,255,255,.06);}
.mini-bar .fill{height:100%; background:linear-gradient(90deg,#ff4d5e,#ff9a5e); transition:width .4s;}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{animation:flash .25s;}
@keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(2.4)}}

.battle-log{flex:1; background:#050a16; border-radius:8px; padding:8px 10px; font-size:9.5px; color:var(--amber); overflow-y:auto; border:1px solid rgba(255,255,255,.05); line-height:1.7; min-height:70px;}
.battle-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

/* ---------- evolution ---------- */
.evo-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:14px; text-align:center;}
.evo-flash{position:absolute; inset:0; background:#fff; opacity:0; z-index:20; pointer-events:none;}
.evo-flash.on{animation:evoflash 1.1s ease;}
@keyframes evoflash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.evo-text{font-family:var(--font-display); font-size:11px; color:var(--cyan); text-shadow:0 0 10px var(--cyan); letter-spacing:1px;}
.evo-choice-row{display:flex; gap:10px; margin-top:6px;}
.evo-card{background:var(--shell-dark); border:1px solid var(--cyan); border-radius:10px; padding:10px; width:110px; display:flex; flex-direction:column; align-items:center; gap:6px;}
.evo-card .ename{font-size:9px; color:var(--text);}
.evo-card .etag{font-size:7.5px; color:var(--dim);}

.footer-note{font-size:8px; color:var(--dim); text-align:center; line-height:1.6; letter-spacing:.5px;}
</style>
</head>
<body>
<div class="app">
  <div class="header"><span class="dot"></span> BYTE BEASTS · DIGIVICE OS</div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="scanlines"></div>
      <div class="screen-glow"></div>
      <div class="evo-flash" id="evoFlash"></div>
      <div id="screenContent"></div>
    </div>
  </div>
  <div class="footer-note" id="footerNote">an original creature-raising game · not affiliated with any existing franchise</div>
</div>

<script>
/* ================= DATA ================= */
const ELEMENTS = ['EMBER','VERDANT','VOLT','TORRENT']; // cycle: strong vs next, weak vs prev
const ELEMENT_COLOR = {EMBER:'#ff8a5c', VERDANT:'#8dfa8d', VOLT:'#fff08a', TORRENT:'#5fd8ff'};

const NAMES = {
  EMBER:   {spore:'Emberling', larva:'Cindrix', cadet:'Pyrokit',
            vanguard_agg:'Emberfang', vanguard_grd:'Cinderwall',
            apex_agg:'Infernyx', apex_grd:'Magmaton'},
  TORRENT: {spore:'Torrentling', larva:'Ripplet', cadet:'Aquabit',
            vanguard_agg:'Tidalfang', vanguard_grd:'Tidewall',
            apex_agg:'Maelstrix', apex_grd:'Leviathon'},
  VERDANT: {spore:'Verdling', larva:'Sproutle', cadet:'Thornkit',
            vanguard_agg:'Brierfang', vanguard_grd:'Rootwall',
            apex_agg:'Thornyx', apex_grd:'Oakenguard'},
  VOLT:    {spore:'Voltling', larva:'Sparkit', cadet:'Zapkit',
            vanguard_agg:'Boltfang', vanguard_grd:'Voltwall',
            apex_agg:'Fulminyx', apex_grd:'Dynamoton'}
};

const STAGE_ORDER = ['spore','larva','cadet','vanguard','apex'];
const STAGE_LEVEL = {spore:1, larva:3, cadet:6, vanguard:10, apex:15};
const STAGE_INDEX = {spore:0, larva:1, cadet:2, vanguard:3, apex:4};

const MOVE_NAME = {
  EMBER:'Cinder Burst', TORRENT:'Riptide', VERDANT:'Thorn Lash', VOLT:'Arc Snap'
};

/* ================= STATE ================= */
let state = {
  screen:'loading', // loading, title, home, battle, evolving
  creature:null,
  enemy:null,
  battleTurnLock:false,
  battleLog:[],
  homeLog:[],
  evo:null // {choices, resultAfter}
};

const SAVE_KEY = 'save';

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function qs(sel, root=document){ return root.querySelector(sel); }

/* ================= CREATURE MODEL ================= */
function newCreature(name, element){
  return {
    name, element, stage:'spore', archetype:null,
    level:1, xp:0,
    energy:100, affection:50,
    hp:0, maxHp:0
  };
}

function statsFor(c){
  const s = STAGE_INDEX[c.stage];
  const base = {hp:14, atk:4, def:4, spd:4};
  // element flavor bonus
  const flavor = {
    EMBER:{atk:2}, TORRENT:{def:2}, VERDANT:{hp:6}, VOLT:{spd:2}
  }[c.element] || {};
  let maxHp = base.hp + (flavor.hp||0) + s*10 + c.level*5;
  let atk = base.atk + (flavor.atk||0) + s*2 + c.level*2;
  let def = base.def + (flavor.def||0) + s*2 + c.level*1.6;
  let spd = base.spd + (flavor.spd||0) + s*1.5 + c.level*1.2;
  if(c.archetype==='agg'){ atk += s*2; def -= s*0.5; }
  if(c.archetype==='grd'){ def += s*2.2; atk -= s*0.5; }
  return {
    maxHp: Math.round(maxHp),
    atk: Math.round(atk),
    def: Math.round(Math.max(1,def)),
    spd: Math.round(spd)
  };
}

function displayName(c){
  const n = NAMES[c.element];
  if(c.stage==='vanguard') return n[c.archetype==='agg'?'vanguard_agg':'vanguard_grd'];
  if(c.stage==='apex') return n[c.archetype==='agg'?'apex_agg':'apex_grd'];
  return n[c.stage];
}

function xpToNext(c){ return c.level*20; }

function syncHp(c){
  const st = statsFor(c);
  if(c.maxHp===0){ c.maxHp = st.maxHp; c.hp = st.maxHp; }
  else {
    const ratio = c.hp / c.maxHp;
    c.maxHp = st.maxHp;
    c.hp = Math.max(1, Math.round(c.maxHp*ratio));
  }
}

/* ================= SAVE / LOAD ================= */
async function saveGame(){
  try{
    await window.storage.set(SAVE_KEY, JSON.stringify({creature:state.creature, homeLog:state.homeLog}), false);
  }catch(e){ /* best effort */ }
}
async function loadGame(){
  try{
    const res = await window.storage.get(SAVE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed.creature){
        state.creature = parsed.creature;
        state.homeLog = parsed.homeLog || [];
        return true;
      }
    }
  }catch(e){ /* no save yet */ }
  return false;
}
async function wipeSave(){
  try{ await window.storage.delete(SAVE_KEY, false); }catch(e){}
}

/* ================= LOGGING ================= */
function pushHomeLog(msg){
  state.homeLog.push(msg);
  if(state.homeLog.length>30) state.homeLog.shift();
}
function pushBattleLog(msg){
  state.battleLog.push(msg);
  if(state.battleLog.length>40) state.battleLog.shift();
}

/* ================= RENDER: CREATURE SPRITE ================= */
function renderSprite(c, size='normal'){
  const scale = size==='small' ? 0.62 : 1;
  const decorations = spriteDecorations(c);
  return `
  <div class="creature-sprite stage-${c.stage} el-${c.element}" style="transform:scale(${scale})">
    <div class="body-blob">
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      ${decorations}
    </div>
  </div>`;
}

function spriteDecorations(c){
  const color = ELEMENT_COLOR[c.element];
  let out = '';
  const idx = STAGE_INDEX[c.stage];
  // limbs from cadet+
  if(idx>=2){
    out += `<div class="limb" style="width:14px;height:20px;left:-6px;bottom:-8px;"></div>`;
    out += `<div class="limb" style="width:14px;height:20px;right:-6px;bottom:-8px;"></div>`;
  }
  // spikes from vanguard+, style differs by archetype
  if(idx>=3){
    const spikeColor = c.archetype==='grd' ? '#d9d9e6' : color;
    for(let i=0;i<3;i++){
      out += `<div class="spike" style="border-bottom:14px solid ${spikeColor}; top:-12px; left:${20+i*22}%; transform:rotate(${(i-1)*8}deg);"></div>`;
    }
    if(c.archetype==='grd'){
      out += `<div class="limb" style="width:22px;height:26px;left:-14px;top:20%;border-radius:30%;opacity:.9;"></div>`;
    }
  }
  // apex aura particles
  if(idx>=4){
    for(let i=0;i<4;i++){
      out += `<div class="particle" style="width:5px;height:5px;background:${color};left:${10+i*22}%;top:${-6-i*4}%;animation-delay:${i*0.3}s;"></div>`;
    }
  }
  return out;
}

/* ================= RENDER: SCREENS ================= */
function render(){
  const root = qs('#screenContent');
  root.innerHTML = '';
  const footer = qs('#footerNote');
  if(state.screen==='title'){
    footer.textContent = 'an original creature-raising game · not affiliated with any existing franchise';
    root.appendChild(renderTitle());
  } else if(state.screen==='home'){
    footer.textContent = 'progress saves automatically to this device';
    root.appendChild(renderHome());
  } else if(state.screen==='battle'){
    footer.textContent = 'choose an action each round';
    root.appendChild(renderBattle());
  } else if(state.screen==='evolving'){
    footer.textContent = 'a new form is taking shape...';
    root.appendChild(renderEvolving());
  }
}

function renderTitle(){
  const wrap = el(`<div class="title-screen">
    <div class="title-logo">BYTE<span>·</span>BEASTS</div>
    <div class="egg-icon"></div>
    <div class="title-sub">name your egg to begin</div>
    <input class="name-input" id="nameInput" maxlength="12" placeholder="e.g. Pixel" />
    <button class="btn" id="hatchBtn">HATCH EGG</button>
  </div>`);
  qs('#hatchBtn', wrap).addEventListener('click', ()=>{
    const inputEl = qs('#nameInput', wrap);
    const name = (inputEl.value || 'Byte').trim().slice(0,12) || 'Byte';
    const element = ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)];
    state.creature = newCreature(name, element);
    syncHp(state.creature);
    state.homeLog = [];
    pushHomeLog(`${name} hatched as an ${element.toLowerCase()}-type Spore!`);
    state.screen = 'home';
    saveGame();
    render();
  });
  return wrap;
}

function renderHome(){
  const c = state.creature;
  syncHp(c);
  const st = statsFor(c);
  const wrap = el(`<div class="home-screen">
    <div class="stat-row">
      <span class="name">${displayName(c)}</span>
      <span>LV.${c.level} · ${c.element}</span>
    </div>
    <div class="stage-arena">${renderSprite(c)}</div>
    <div class="bars">
      <div>
        <div class="bar-label"><span>HP</span><span>${c.hp}/${st.maxHp}</span></div>
        <div class="bar-track"><div class="bar-fill hp" style="width:${(c.hp/st.maxHp)*100}%"></div></div>
      </div>
      <div>
        <div class="bar-label"><span>XP</span><span>${c.xp}/${xpToNext(c)}</span></div>
        <div class="bar-track"><div class="bar-fill xp" style="width:${(c.xp/xpToNext(c))*100}%"></div></div>
      </div>
      <div>
        <div class="bar-label"><span>ENERGY</span><span>${Math.round(c.energy)}</span></div>
        <div class="bar-track"><div class="bar-fill energy" style="width:${c.energy}%"></div></div>
      </div>
      <div>
        <div class="bar-label"><span>AFFECTION</span><span>${Math.round(c.affection)}</span></div>
        <div class="bar-track"><div class="bar-fill affection" style="width:${c.affection}%"></div></div>
      </div>
    </div>
    <div class="log-panel" id="homeLogPanel"></div>
    <div class="action-grid">
      <button class="btn" id="feedBtn">FEED</button>
      <button class="btn amber" id="trainBtn">TRAIN</button>
      <button class="btn magenta" id="exploreBtn">EXPLORE</button>
      <button class="btn ghost" id="restBtn">REST</button>
    </div>
  </div>`);

  const logPanel = qs('#homeLogPanel', wrap);
  logPanel.innerHTML = state.homeLog.slice(-6).map((m,i,arr)=>`<div class="${i<arr.length-1?'old':''}">${m}</div>`).join('');
  logPanel.scrollTop = logPanel.scrollHeight;

  qs('#feedBtn', wrap).addEventListener('click', ()=>{
    if(c.hp<=0) return;
    c.energy = Math.min(100, c.energy+18);
    c.affection = Math.min(100, c.affection+6);
    c.xp += 2;
    pushHomeLog(`You fed ${c.name}. Energy and affection rose.`);
    handleXpAndRender();
  });
  qs('#trainBtn', wrap).addEventListener('click', ()=>{
    if(c.energy<15){ pushHomeLog(`${c.name} is too tired to train. Try resting.`); render(); return; }
    c.energy -= 15;
    const gained = 6 + Math.floor(Math.random()*6);
    c.xp += gained;
    pushHomeLog(`Training session complete. +${gained} XP.`);
    handleXpAndRender();
  });
  qs('#restBtn', wrap).addEventListener('click', ()=>{
    c.energy = Math.min(100, c.energy+30);
    if(c.hp<st.maxHp){ c.hp = Math.min(st.maxHp, c.hp + Math.round(st.maxHp*0.3)); }
    pushHomeLog(`${c.name} rested and recovered energy.`);
    saveGame();
    render();
  });
  qs('#exploreBtn', wrap).addEventListener('click', ()=>{
    if(c.hp<=0){ pushHomeLog(`${c.name} needs to rest before exploring.`); render(); return; }
    startBattle();
  });
  return wrap;
}

function handleXpAndRender(){
  const c = state.creature;
  let leveled = false;
  while(c.xp >= xpToNext(c)){
    c.xp -= xpToNext(c);
    c.level += 1;
    leveled = true;
  }
  if(leveled) pushHomeLog(`${c.name} reached Level ${c.level}!`);
  syncHp(c);
  saveGame();

  // check evolution
  const nextStageIdx = STAGE_INDEX[c.stage]+1;
  const nextStageKey = STAGE_ORDER[nextStageIdx];
  if(nextStageKey && c.level >= STAGE_LEVEL[nextStageKey]){
    triggerEvolution(nextStageKey);
    return;
  }
  render();
}

/* ================= EVOLUTION ================= */
function triggerEvolution(nextStageKey){
  state.screen = 'evolving';
  state.evo = { nextStageKey, needsChoice: nextStageKey==='vanguard' };
  render();
}

function renderEvolving(){
  const c = state.creature;
  const evo = state.evo;
  const wrap = el(`<div class="evo-screen">
    <div class="evo-text" id="evoLine">A DIGITAL SURGE IS BUILDING...</div>
    <div id="evoStage">${renderSprite(c)}</div>
    <div id="evoChoiceZone"></div>
  </div>`);

  setTimeout(()=>{
    const flash = qs('#evoFlash');
    flash.classList.add('on');
    setTimeout(()=>flash.classList.remove('on'), 1100);
  }, 400);

  setTimeout(()=>{
    if(evo.needsChoice){
      qs('#evoLine', wrap).textContent = `CHOOSE ${c.name}'S PATH`;
      const choiceZone = qs('#evoChoiceZone', wrap);
      const preview = (arche)=>{
        const clone = Object.assign({}, c, {stage:'vanguard', archetype:arche});
        return renderSprite(clone, 'small');
      };
      choiceZone.appendChild(el(`<div class="evo-choice-row">
        <div class="evo-card" id="choiceAgg">
          ${preview('agg')}
          <div class="ename">${NAMES[c.element].vanguard_agg}</div>
          <div class="etag">Aggressive · +ATK</div>
        </div>
        <div class="evo-card" id="choiceGrd">
          ${preview('grd')}
          <div class="ename">${NAMES[c.element].vanguard_grd}</div>
          <div class="etag">Guardian · +DEF</div>
        </div>
      </div>`));
      qs('#choiceAgg', wrap).addEventListener('click', ()=>finalizeEvolution('agg'));
      qs('#choiceGrd', wrap).addEventListener('click', ()=>finalizeEvolution('grd'));
    } else {
      finalizeEvolution(c.archetype);
    }
  }, 1500);

  return wrap;
}

function finalizeEvolution(archetype){
  const c = state.creature;
  c.stage = state.evo.nextStageKey;
  if(archetype) c.archetype = archetype;
  syncHp(c);
  c.hp = c.maxHp;
  pushHomeLog(`${c.name} evolved into ${displayName(c)}!`);
  state.evo = null;
  saveGame();
  state.screen = 'home';
  render();
}

/* ================= BATTLE ================= */
function makeEnemy(playerLevel){
  const element = ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)];
  const level = Math.max(1, playerLevel + Math.floor(Math.random()*3) - 1);
  const stageOptions = STAGE_ORDER.filter(s=>STAGE_LEVEL[s] <= level+1);
  const stage = stageOptions[stageOptions.length-1] || 'spore';
  const archetype = Math.random()<0.5 ? 'agg':'grd';
  const enemy = {name:'Wild '+NAMES[element][stage==='vanguard'?'vanguard_'+archetype:(stage==='apex'?'apex_'+archetype:stage)], element, stage, archetype, level};
  const st = statsFor(enemy);
  enemy.maxHp = st.maxHp; enemy.hp = st.maxHp;
  return enemy;
}

function elementMultiplier(atkEl, defEl){
  if(atkEl===defEl) return 1;
  const ai = ELEMENTS.indexOf(atkEl), di = ELEMENTS.indexOf(defEl);
  if((ai+1)%4===di) return 1.5;
  if((di+1)%4===ai) return 0.67;
  return 1;
}

function startBattle(){
  state.enemy = makeEnemy(state.creature.level);
  state.battleLog = [`A wild ${state.enemy.name} (Lv.${state.enemy.level}) appears!`];
  state.battleTurnLock = false;
  state.screen = 'battle';
  render();
}

function renderBattle(){
  const c = state.creature; const e = state.enemy;
  const cst = statsFor(c), est = statsFor(e);
  const wrap = el(`<div class="battle-screen">
    <div class="vs-row">
      <div class="combatant" id="playerSide">
        <div class="cname">${displayName(c)}</div>
        <div class="lvl">LV.${c.level}</div>
        ${renderSprite(c,'small')}
        <div class="mini-bar"><div class="fill" id="pHpFill" style="width:${(c.hp/cst.maxHp)*100}%"></div></div>
      </div>
      <div class="combatant" id="enemySide">
        <div class="cname">${e.name}</div>
        <div class="lvl">LV.${e.level}</div>
        ${renderSprite(e,'small')}
        <div class="mini-bar"><div class="fill" id="eHpFill" style="width:${(e.hp/est.maxHp)*100}%"></div></div>
      </div>
    </div>
    <div class="battle-log" id="battleLog"></div>
    <div class="battle-actions">
      <button class="btn" id="atkBtn">ATTACK</button>
      <button class="btn amber" id="specBtn">${MOVE_NAME[c.element].toUpperCase()}</button>
      <button class="btn ghost" id="guardBtn">GUARD</button>
      <button class="btn magenta" id="fleeBtn">FLEE</button>
    </div>
  </div>`);

  const logPanel = qs('#battleLog', wrap);
  logPanel.innerHTML = state.battleLog.map((m,i,arr)=>`<div class="${i<arr.length-1?'old':''}">${m}</div>`).join('');
  logPanel.scrollTop = logPanel.scrollHeight;

  const lock = state.battleTurnLock;
  qs('#atkBtn', wrap).disabled = lock;
  qs('#specBtn', wrap).disabled = lock || c.energy<15;
  qs('#guardBtn', wrap).disabled = lock;
  qs('#fleeBtn', wrap).disabled = lock;

  qs('#atkBtn', wrap).addEventListener('click', ()=>runBattleTurn('attack'));
  qs('#specBtn', wrap).addEventListener('click', ()=>runBattleTurn('special'));
  qs('#guardBtn', wrap).addEventListener('click', ()=>runBattleTurn('guard'));
  qs('#fleeBtn', wrap).addEventListener('click', ()=>runBattleTurn('flee'));

  return wrap;
}

function runBattleTurn(playerAction){
  if(state.battleTurnLock) return;
  state.battleTurnLock = true;
  const c = state.creature, e = state.enemy;
  const cst = statsFor(c), est = statsFor(e);

  if(playerAction==='flee'){
    const chance = 0.4 + (cst.spd-est.spd)*0.02;
    if(Math.random() < Math.max(0.15, Math.min(0.85, chance))){
      pushBattleLog(`You fled from the wild ${e.name}.`);
      finishBattleRender(()=>{ state.screen='home'; saveGame(); render(); });
      return;
    } else {
      pushBattleLog(`Couldn't escape!`);
    }
  } else if(playerAction==='attack'){
    const mult = elementMultiplier(c.element, e.element);
    const dmg = Math.max(1, Math.round((cst.atk*(0.85+Math.random()*0.3)*mult) - est.def*0.5));
    e.hp = Math.max(0, e.hp - dmg);
    pushBattleLog(`${c.name} attacks for ${dmg}${mult>1?' (super effective!)':mult<1?' (resisted)':''}.`);
    animateHit('enemySide','eHpFill', e.hp/est.maxHp);
  } else if(playerAction==='special'){
    c.energy -= 15;
    const mult = elementMultiplier(c.element, e.element);
    const dmg = Math.max(1, Math.round((cst.atk*1.5*(0.85+Math.random()*0.3)*mult) - est.def*0.4));
    e.hp = Math.max(0, e.hp - dmg);
    pushBattleLog(`${c.name} uses ${MOVE_NAME[c.element]} for ${dmg}${mult>1?' (super effective!)':mult<1?' (resisted)':''}.`);
    animateHit('enemySide','eHpFill', e.hp/est.maxHp);
  } else if(playerAction==='guard'){
    pushBattleLog(`${c.name} braces for impact.`);
  }

  if(e.hp<=0){
    pushBattleLog(`The wild ${e.name} was defeated!`);
    const xpGain = e.level*8 + Math.floor(Math.random()*6);
    c.xp += xpGain;
    c.affection = Math.min(100, c.affection+4);
    pushBattleLog(`${c.name} gained ${xpGain} XP.`);
    finishBattleRender(()=>{ state.screen='home'; handleXpAndRender(); });
    return;
  }

  // enemy turn
  setTimeout(()=>{
    const roll = Math.random();
    let guarded = playerAction==='guard';
    if(roll<0.6 || e.hp <= 0){
      const mult = elementMultiplier(e.element, c.element);
      let dmg = Math.max(1, Math.round((est.atk*(0.85+Math.random()*0.3)*mult) - cst.def*0.5));
      if(guarded) dmg = Math.round(dmg*0.5);
      c.hp = Math.max(0, c.hp - dmg);
      pushBattleLog(`${e.name} strikes ${c.name} for ${dmg}${guarded?' (guarded)':''}.`);
      animateHit('playerSide','pHpFill', c.hp/cst.maxHp);
    } else if(roll<0.85){
      const mult = elementMultiplier(e.element, c.element);
      let dmg = Math.max(1, Math.round((est.atk*1.4*(0.85+Math.random()*0.3)*mult) - cst.def*0.4));
      if(guarded) dmg = Math.round(dmg*0.5);
      c.hp = Math.max(0, c.hp - dmg);
      pushBattleLog(`${e.name} unleashes a fierce strike for ${dmg}${guarded?' (guarded)':''}.`);
      animateHit('playerSide','pHpFill', c.hp/cst.maxHp);
    } else {
      pushBattleLog(`${e.name} hesitates.`);
    }

    if(c.hp<=0){
      pushBattleLog(`${c.name} fainted! Retreating home to recover...`);
      c.energy = Math.max(0, c.energy-20);
      c.affection = Math.max(0, c.affection-4);
      finishBattleRender(()=>{
        c.hp = 1;
        state.screen='home';
        saveGame();
        render();
      }, 1400);
      return;
    }

    state.battleTurnLock = false;
    render();
  }, 700);
}

function animateHit(sideId, fillId, ratio){
  const sideEl = qs('#'+sideId);
  const fillEl = qs('#'+fillId);
  if(sideEl){ sideEl.classList.add('shake'); setTimeout(()=>sideEl.classList.remove('shake'), 300); }
  if(fillEl){ fillEl.style.width = Math.max(0,ratio*100)+'%'; }
}

function finishBattleRender(cb, delay=900){
  render();
  setTimeout(cb, delay);
}

/* ================= BOOT ================= */
async function boot(){
  const had = await loadGame();
  if(had && state.creature){
    syncHp(state.creature);
    state.screen = 'home';
  } else {
    state.screen = 'title';
  }
  render();
}
boot();
</script>
