<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>GLOWKIN — A Creature Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #12111f;
    --bg-panel: #1c1a2e;
    --bg-panel2: #24213a;
    --line: #322e4d;
    --ember: #ff7a45;
    --tidal: #35c1e0;
    --moss: #63c76a;
    --volt: #f2d94e;
    --terra: #c98f4e;
    --normal: #b9b4d6;
    --text: #f1eefc;
    --muted: #9a94bd;
    --accent: #c9a6ff;
    --accent2: #7c5cff;
    --good: #63c76a;
    --bad: #ff5d6c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 800px at 50% -10%, #23204a 0%, var(--bg-void) 60%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 18px;
  }
  h1,h2,h3, .display{ font-family:'Baloo 2', sans-serif; }
  #app{
    width: 100%;
    max-width: 860px;
    min-height: 620px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
    position: relative;
  }
  ::selection{ background: var(--accent2); color:white; }

  /* ---------- generic ---------- */
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size: 16px;
    color: var(--text);
    background: var(--bg-panel2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 18px;
    cursor:pointer;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover{ border-color: var(--accent2); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0px) scale(.98); }
  .btn.primary{ background: linear-gradient(180deg, var(--accent2), #5b3fe0); border-color: transparent; }
  .btn.primary:hover{ filter: brightness(1.08); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; transform:none; }
  .btn.small{ padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size: 11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding: 3px 9px; border-radius: 999px; color:#12111f;
  }
  .muted{ color: var(--muted); }
  .screen{ padding: 26px 28px; min-height: 620px; display:flex; flex-direction:column; }

  /* ---------- title ---------- */
  .title-screen{ align-items:center; justify-content:center; text-align:center; gap: 10px; position:relative; overflow:hidden;}
  .title-orbs{ position:absolute; inset:0; pointer-events:none; }
  .title-orbs span{
    position:absolute; border-radius:50%; filter: blur(2px); opacity:.5;
    animation: float 7s ease-in-out infinite;
  }
  @keyframes float{ 0%,100%{ transform: translateY(0px);} 50%{ transform: translateY(-22px);} }
  .logo{
    font-size: 58px; font-weight:800; letter-spacing:.01em; margin:0;
    background: linear-gradient(180deg, #fff, var(--accent) 130%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 60px rgba(201,166,255,.35);
  }
  .tagline{ color:var(--muted); font-size:15px; margin-top:-6px; margin-bottom: 18px;}

  /* ---------- starter select ---------- */
  .starter-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; margin-top: 18px; }
  .starter-card{
    background: var(--bg-panel2); border:1px solid var(--line); border-radius:18px;
    padding: 18px 14px; text-align:center; cursor:pointer; transition: all .15s ease;
  }
  .starter-card:hover{ border-color: var(--accent2); transform: translateY(-4px); }
  .starter-card.selected{ border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }

  /* ---------- creature blob ---------- */
  .blob-wrap{ display:flex; align-items:center; justify-content:center; position:relative; }
  .blob{
    width: 86px; height: 86px; border-radius: 46% 54% 55% 45% / 50% 45% 55% 50%;
    position:relative; margin: 0 auto 10px;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.03), 0 10px 30px rgba(0,0,0,.4);
    animation: bob 3.2s ease-in-out infinite;
  }
  .blob.lg{ width:128px; height:128px; }
  .blob::before, .blob::after{
    content:''; position:absolute; width:12px; height:14px; background:#171526; border-radius:50%;
    top: 38%;
  }
  .blob::before{ left: 30%; }
  .blob::after{ left: 58%; }
  .blob .aura{
    position:absolute; inset:-14px; border-radius: 50%;
    filter: blur(10px); opacity:.35; z-index:-1;
  }
  @keyframes bob{ 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(-6px) rotate(-2deg);} }
  .hit{ animation: hitshake .35s ease; }
  @keyframes hitshake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-10px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(4px);} }
  .faint{ opacity:.15; filter: grayscale(1); transform: translateY(14px) rotate(90deg) !important; }

  /* element colors for blobs/badges */
  .el-Ember{ background: radial-gradient(circle at 35% 30%, #ffb08a, var(--ember)); } .aura-Ember{ background:var(--ember); }
  .el-Tidal{ background: radial-gradient(circle at 35% 30%, #9fe6f7, var(--tidal)); } .aura-Tidal{ background:var(--tidal); }
  .el-Moss{ background: radial-gradient(circle at 35% 30%, #b2edb0, var(--moss)); } .aura-Moss{ background:var(--moss); }
  .el-Volt{ background: radial-gradient(circle at 35% 30%, #fbf1ab, var(--volt)); } .aura-Volt{ background:var(--volt); }
  .el-Terra{ background: radial-gradient(circle at 35% 30%, #e8c99a, var(--terra)); } .aura-Terra{ background:var(--terra); }
  .badge-Ember{ background:var(--ember); } .badge-Tidal{ background:var(--tidal); } .badge-Moss{ background:var(--moss); }
  .badge-Volt{ background:var(--volt); } .badge-Terra{ background:var(--terra); } .badge-Normal{ background:var(--normal); }

  /* ---------- overworld ---------- */
  .overworld{ flex-direction: row; gap: 18px; align-items:stretch; }
  .map-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
  .map-grid{
    display:grid; grid-template-columns: repeat(7, 44px); grid-template-rows: repeat(6, 44px);
    gap: 3px; padding: 10px; background:#0e0d1a; border-radius:16px; border:1px solid var(--line);
  }
  .tile{ width:44px; height:44px; border-radius:8px; position:relative; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .tile.path{ background:#2a2745; }
  .tile.grass{ background: linear-gradient(160deg, #22391f, #2c4a26); box-shadow: inset 0 0 12px rgba(99,199,106,.25);}
  .tile.tree{ background:#191730; }
  .tile.tree::after{ content:'♦'; color:#3a3660; font-size:16px; }
  .tile.town{ background: linear-gradient(160deg, #3a2f5e, #4a3b74); box-shadow: 0 0 16px rgba(201,166,255,.35); }
  .player-dot{
    position:absolute; width:18px; height:18px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent));
    box-shadow: 0 0 12px var(--accent); transition: all .12s ease;
  }
  .dpad{ display:grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3,46px); gap:6px; }
  .dpad button{ font-size:18px; }
  .dpad .empty{ visibility:hidden; }
  .side-col{ width: 250px; display:flex; flex-direction:column; gap:12px; }
  .panel{ background: var(--bg-panel2); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .roster-item{ display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .roster-item:last-child{ border-bottom:none; }
  .mini-blob{ width:30px; height:30px; border-radius:50%; flex-shrink:0; }
  .hpbar-wrap{ height:7px; background:#131022; border-radius:6px; overflow:hidden; flex:1; }
  .hpbar{ height:100%; background: linear-gradient(90deg, var(--good), #8fe08f); transition: width .5s ease; }
  .hpbar.mid{ background: linear-gradient(90deg, var(--volt), #f7e488); }
  .hpbar.low{ background: linear-gradient(90deg, var(--bad), #ff8f98); }
  .toast{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background: var(--bg-panel2); border:1px solid var(--accent2); color:var(--text);
    padding:8px 16px; border-radius:12px; font-size:13px; z-index:20; opacity:0; pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(4px); }

  /* ---------- battle ---------- */
  .battle{ padding:0; }
  .battle-top{
    flex:1; display:flex; flex-direction:column; justify-content:space-between; padding: 20px 24px;
    background:
      radial-gradient(500px 260px at 15% 0%, rgba(255,122,69,.06), transparent),
      radial-gradient(500px 260px at 85% 100%, rgba(124,92,255,.10), transparent);
  }
  .fighter-row{ display:flex; justify-content:space-between; align-items:flex-start; gap: 16px;}
  .fighter-card{ width: 46%; }
  .fighter-card.enemy{ text-align:right; }
  .name-row{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .fighter-card.enemy .name-row{ justify-content:flex-end; }
  .lvl-tag{ font-size:12px; color:var(--muted); font-weight:600; }
  .stage{ display:flex; justify-content:space-between; align-items:center; margin: 10px 0 4px; }
  .stage .blob-wrap.enemy{ margin-left:auto; }
  .battle-log{
    background: rgba(0,0,0,.25); border-radius: 12px; padding: 10px 14px; font-size:13.5px; min-height: 42px;
    color: var(--text); border:1px solid var(--line);
  }
  .actions{ background: var(--bg-panel); border-top:1px solid var(--line); padding: 16px 24px; }
  .action-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
  .move-btn{ text-align:left; padding: 10px 12px; }
  .move-btn .mv-name{ font-weight:700; font-size:14px; }
  .move-btn .mv-meta{ font-size:11px; color:var(--muted); margin-top:2px; }
  .back-row{ margin-top:10px; }

  /* ---------- team screen ---------- */
  .team-list{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .team-row{ display:flex; align-items:center; gap:14px; background:var(--bg-panel2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .team-row.active{ border-color: var(--accent); }
  .stat-mini{ font-size:11px; color:var(--muted); }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }

  @media (max-width: 640px){
    .overworld{ flex-direction:column; }
    .map-grid{ grid-template-columns: repeat(7, 34px); grid-template-rows: repeat(6,34px); }
    .tile{ width:34px; height:34px; font-size:14px; }
    .side-col{ width:100%; flex-direction:row; flex-wrap:wrap; }
    .side-col .panel{ flex:1; min-width: 140px; }
    .starter-grid{ grid-template-columns: 1fr; }
    .action-grid{ grid-template-columns: repeat(2,1fr); }
    .fighter-card{ width:48%; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============ DATA ============ */
  const STRONG = { Ember:'Moss', Moss:'Terra', Terra:'Volt', Volt:'Tidal', Tidal:'Ember' };
  const GROWTH = { hp:5.2, atk:1.5, def:1.2, spd:1.2 };

  const MOVES = {
    embernip:   { name:'Embernip',    element:'Ember',  power:32, acc:.95 },
    flareburst: { name:'Flare Burst', element:'Ember',  power:48, acc:.85 },
    bubblejet:  { name:'Bubble Jet',  element:'Tidal',  power:32, acc:.95 },
    tidalwave:  { name:'Tidal Wave',  element:'Tidal',  power:48, acc:.85 },
    vinewhip:   { name:'Vine Whip',   element:'Moss',   power:32, acc:.95 },
    bloomburst: { name:'Bloom Burst', element:'Moss',   power:48, acc:.85 },
    shocknip:   { name:'Shock Nip',   element:'Volt',   power:30, acc:.9  },
    prismbeam:  { name:'Prism Beam',  element:'Volt',   power:50, acc:.8  },
    rockhit:    { name:'Rock Hit',    element:'Terra',  power:30, acc:.95 },
    boulder:    { name:'Boulder Crash',element:'Terra', power:48, acc:.85 },
    tackle:     { name:'Tackle',      element:'Normal', power:20, acc:1   },
    wingslash:  { name:'Wing Slash',  element:'Normal', power:26, acc:1   },
    guard:      { name:'Guard',       element:'Guard',  power:0,  acc:1   }
  };

  const SPECIES = {
    cindrix:  { name:'Cindrix',  element:'Ember', base:{hp:38,atk:12,def:9, spd:11}, catch:.30, rarity:'starter', moves:['embernip','tackle','flareburst','guard'] },
    aquilo:   { name:'Aquilo',   element:'Tidal', base:{hp:42,atk:10,def:11,spd:9 }, catch:.30, rarity:'starter', moves:['bubblejet','tackle','tidalwave','guard'] },
    sproutle: { name:'Sproutle', element:'Moss',  base:{hp:40,atk:11,def:10,spd:10}, catch:.30, rarity:'starter', moves:['vinewhip','tackle','bloomburst','guard'] },
    emberkit: { name:'Emberkit', element:'Ember', base:{hp:24,atk:9, def:6, spd:12}, catch:.55, rarity:'common', moves:['embernip','tackle','guard'] },
    puddlepup:{ name:'Puddlepup',element:'Tidal', base:{hp:26,atk:8, def:7, spd:10}, catch:.55, rarity:'common', moves:['bubblejet','tackle','guard'] },
    leaflit:  { name:'Leaflit',  element:'Moss',  base:{hp:25,atk:8, def:8, spd:9 }, catch:.55, rarity:'common', moves:['vinewhip','tackle','guard'] },
    sparklet: { name:'Sparklet', element:'Volt',  base:{hp:22,atk:10,def:5, spd:14}, catch:.50, rarity:'common', moves:['shocknip','tackle','guard'] },
    pebblen:  { name:'Pebblen',  element:'Terra', base:{hp:30,atk:9, def:10,spd:6 }, catch:.50, rarity:'common', moves:['rockhit','tackle','guard'] },
    glimmowl: { name:'Glimmowl', element:'Volt',  base:{hp:34,atk:13,def:9, spd:13}, catch:.18, rarity:'rare',   moves:['shocknip','wingslash','prismbeam','guard'] }
  };

  const WILD_POOL = ['emberkit','puddlepup','leaflit','sparklet','pebblen','pebblen','emberkit','puddlepup','leaflit','sparklet','glimmowl'];

  // map: # tree(blocked)  . path  G grass(encounter)  T town(heal+restock)
  const MAP = [
    "#######",
    "#T...G#",
    "#.##.G#",
    "#GG...#",
    "#G#.#G#",
    "#######"
  ];
  const START_POS = { x:1, y:1 };

  /* ============ STATE ============ */
  const state = {
    screen: 'title',
    team: [],
    orbs: 5,
    caughtLog: {},
    pos: { x: START_POS.x, y: START_POS.y },
    lastTown: { x: START_POS.x, y: START_POS.y },
    battle: null,
    starterPick: null,
    pendingForcedSwitch: false
  };

  /* ============ HELPERS ============ */
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function xpNeeded(level){ return Math.round(18 * level + 12); }

  function computeStats(speciesKey, level){
    const sp = SPECIES[speciesKey];
    const hp  = Math.round(sp.base.hp  + GROWTH.hp  * (level-1));
    const atk = Math.round(sp.base.atk + GROWTH.atk * (level-1));
    const def = Math.round(sp.base.def + GROWTH.def * (level-1));
    const spd = Math.round(sp.base.spd + GROWTH.spd * (level-1));
    return { hp, atk, def, spd };
  }

  function makeCreature(speciesKey, level){
    const stats = computeStats(speciesKey, level);
    return {
      id: speciesKey + '_' + Math.random().toString(36).slice(2,8),
      species: speciesKey,
      level,
      xp: 0,
      hp: stats.hp,
      maxHp: stats.hp,
      atk: stats.atk,
      def: stats.def,
      spd: stats.spd,
      guarding: false
    };
  }

  function typeMultiplier(atkEl, defEl){
    if(atkEl === 'Normal' || atkEl === 'Guard' || defEl === 'Normal') return 1;
    if(STRONG[atkEl] === defEl) return 2;
    if(STRONG[defEl] === atkEl) return 0.5;
    return 1;
  }

  function hpPct(c){ return c.hp / c.maxHp; }
  function hpBarClass(c){ const p = hpPct(c); return p > .5 ? '' : (p > .2 ? 'mid' : 'low'); }

  function refreshStatsKeepingRatio(c){
    const ratio = c.hp / c.maxHp;
    const stats = computeStats(c.species, c.level);
    c.maxHp = stats.hp; c.atk = stats.atk; c.def = stats.def; c.spd = stats.spd;
    c.hp = Math.max(1, Math.round(stats.hp * ratio));
  }

  function gainXp(c, amount){
    let leveledUp = false;
    c.xp += amount;
    while(c.xp >= xpNeeded(c.level)){
      c.xp -= xpNeeded(c.level);
      c.level += 1;
      leveledUp = true;
      const ratio = 1; // full heal portion of the gain feels good
      const stats = computeStats(c.species, c.level);
      const healthGain = stats.hp - c.maxHp;
      c.maxHp = stats.hp; c.atk = stats.atk; c.def = stats.def; c.spd = stats.spd;
      c.hp = clamp(c.hp + healthGain, 1, c.maxHp);
    }
    return leveledUp;
  }

  function activeCreature(){ return state.team[0]; }
  function aliveTeam(){ return state.team.filter(c => c.hp > 0); }

  function toast(msg){
    const el = document.getElementById('toast');
    if(!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> el.classList.remove('show'), 1800);
  }

  /* ============ RENDER ROOT ============ */
  function render(){
    const app = document.getElementById('app');
    if(state.screen === 'title') app.innerHTML = renderTitle();
    else if(state.screen === 'starter') app.innerHTML = renderStarter();
    else if(state.screen === 'overworld') app.innerHTML = renderOverworld();
    else if(state.screen === 'battle') app.innerHTML = renderBattle();
    else if(state.screen === 'team') app.innerHTML = renderTeam();
    attachHandlers();
  }

  /* ============ TITLE ============ */
  function renderTitle(){
    return `
      <div class="screen title-screen">
        <div class="title-orbs">
          <span style="width:120px;height:120px;left:8%;top:16%;background:var(--ember);animation-duration:8s;"></span>
          <span style="width:90px;height:90px;left:80%;top:12%;background:var(--tidal);animation-duration:6.5s;"></span>
          <span style="width:70px;height:70px;left:70%;top:70%;background:var(--moss);animation-duration:9s;"></span>
          <span style="width:60px;height:60px;left:15%;top:75%;background:var(--volt);animation-duration:7.5s;"></span>
        </div>
        <h1 class="logo">GLOWKIN</h1>
        <p class="tagline">a small world of glimmering creatures, waiting to be found</p>
        <button class="btn primary" id="btn-start" style="font-size:18px; padding:14px 28px;">Start Adventure</button>
        <p class="muted" style="margin-top:22px; font-size:13px;">arrow keys / WASD to move once you're in the wild</p>
      </div>`;
  }

  /* ============ STARTER SELECT ============ */
  function renderStarter(){
    const options = ['cindrix','aquilo','sproutle'];
    const cards = options.map(key => {
      const sp = SPECIES[key];
      const sel = state.starterPick === key ? 'selected' : '';
      return `
        <div class="starter-card ${sel}" data-starter="${key}">
          <div class="blob-wrap"><div class="aura aura-${sp.element}"></div><div class="blob el-${sp.element}"></div></div>
          <div class="display" style="font-size:19px; font-weight:700;">${sp.name}</div>
          <span class="badge badge-${sp.element}">${sp.element}</span>
          <div class="muted" style="font-size:12px; margin-top:8px;">HP ${sp.base.hp} · ATK ${sp.base.atk} · DEF ${sp.base.def} · SPD ${sp.base.spd}</div>
        </div>`;
    }).join('');
    return `
      <div class="screen">
        <h2 style="margin:0;">Choose your first companion</h2>
        <p class="muted" style="margin-top:4px;">This Glowkin will start at your side. You'll find more in the wild grass.</p>
        <div class="starter-grid">${cards}</div>
        <div style="margin-top:auto; display:flex; justify-content:flex-end;">
          <button class="btn primary" id="btn-confirm-starter" ${state.starterPick ? '' : 'disabled'}>Set out</button>
        </div>
      </div>`;
  }

  /* ============ OVERWORLD ============ */
  function tileAt(x,y){
    if(y < 0 || y >= MAP.length || x < 0 || x >= MAP[0].length) return '#';
    return MAP[y][x];
  }

  function renderMapGrid(){
    let html = '';
    for(let y=0;y<MAP.length;y++){
      for(let x=0;x<MAP[0].length;x++){
        const t = tileAt(x,y);
        const cls = t === '#' ? 'tree' : t === 'G' ? 'grass' : t === 'T' ? 'town' : 'path';
        const isPlayer = state.pos.x === x && state.pos.y === y;
        html += `<div class="tile ${cls}">${isPlayer ? '<div class="player-dot"></div>' : ''}</div>`;
      }
    }
    return html;
  }

  function renderOverworld(){
    const rosterHtml = state.team.map((c,i) => {
      const sp = SPECIES[c.species];
      return `
        <div class="roster-item">
          <div class="mini-blob el-${sp.element}"></div>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; justify-content:space-between; font-size:12.5px;">
              <span>${sp.name} ${i===0 ? '★' : ''}</span><span class="muted">Lv${c.level}</span>
            </div>
            <div class="hpbar-wrap"><div class="hpbar ${hpBarClass(c)}" style="width:${clamp(hpPct(c)*100,0,100)}%"></div></div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="screen overworld">
        <div class="map-col">
          <div class="map-grid">${renderMapGrid()}</div>
          <div class="dpad">
            <div class="empty"></div><button class="btn small" data-move="up">▲</button><div class="empty"></div>
            <button class="btn small" data-move="left">◀</button><div class="empty"></div><button class="btn small" data-move="right">▶</button>
            <div class="empty"></div><button class="btn small" data-move="down">▼</button><div class="empty"></div>
          </div>
          <p class="muted" style="font-size:12px; text-align:center;">step through the glowing grass to meet wild Glowkin</p>
        </div>
        <div class="side-col">
          <div class="panel">
            <div class="topbar"><strong style="font-family:'Baloo 2';">Your Team</strong><span class="muted" style="font-size:12px;">${state.team.length}/6</span></div>
            ${rosterHtml}
          </div>
          <div class="panel row" style="justify-content:space-between; align-items:center;">
            <span class="muted" style="font-size:13px;">Glimmer Orbs</span>
            <strong>✦ ${state.orbs}</strong>
          </div>
          <button class="btn" id="btn-open-team">View Team Details</button>
        </div>
        <div class="toast" id="toast"></div>
      </div>`;
  }

  function tryMove(dx, dy){
    if(state.screen !== 'overworld') return;
    const nx = state.pos.x + dx, ny = state.pos.y + dy;
    const t = tileAt(nx, ny);
    if(t === '#') return;
    state.pos = { x: nx, y: ny };

    if(t === 'T'){
      state.lastTown = { x:nx, y:ny };
      const healed = state.team.some(c => c.hp < c.maxHp);
      state.team.forEach(c => c.hp = c.maxHp);
      let msg = '';
      if(healed) msg += 'Your Glowkin feel fully restored. ';
      if(state.orbs < 10){ state.orbs += 1; msg += '+1 Glimmer Orb.'; }
      if(msg) toast(msg.trim());
      render();
      return;
    }

    render();

    if(t === 'G' && Math.random() < 0.32){
      startWildBattle();
    }
  }

  /* ============ BATTLE ============ */
  function startWildBattle(){
    const poolKey = WILD_POOL[rnd(0, WILD_POOL.length-1)];
    const lvl = rnd(3, 8);
    const wild = makeCreature(poolKey, lvl);
    if(activeCreature().hp <= 0){
      const idx = state.team.findIndex(c => c.hp > 0);
      if(idx > 0){ const [c] = state.team.splice(idx,1); state.team.unshift(c); }
    }
    state.battle = {
      wild,
      log: [`A wild ${SPECIES[wild.species].name} appeared!`],
      turnLock: false,
      awaitingSwitch: false,
      justCaught: false
    };
    state.screen = 'battle';
    render();
  }

  function pushLog(msg){
    state.battle.log.push(msg);
    state.battle.log = state.battle.log.slice(-3);
  }

  function endBattle(returnMsg){
    state.battle = null;
    state.screen = 'overworld';
    render();
    if(returnMsg) toast(returnMsg);
  }

  function doDamage(attacker, defender, move){
    if(move.element === 'Guard'){
      attacker.guarding = true;
      pushLog(`${nameOf(attacker)} braces for impact.`);
      return;
    }
    if(Math.random() > move.acc){
      pushLog(`${nameOf(attacker)}'s ${move.name} missed!`);
      return;
    }
    const mult = typeMultiplier(move.element, SPECIES[defender.species].element);
    let dmg = Math.floor(((attacker.atk * move.power) / Math.max(4, defender.def)) * mult * (0.85 + Math.random()*0.15));
    if(defender.guarding) dmg = Math.floor(dmg * 0.6);
    dmg = Math.max(1, dmg);
    defender.hp = clamp(defender.hp - dmg, 0, defender.maxHp);
    let tag = mult === 2 ? ' Super effective!' : mult === 0.5 ? ' Not very effective...' : '';
    pushLog(`${nameOf(attacker)} used ${move.name}! ${dmg} dmg.${tag}`);
  }

  function nameOf(c){ return SPECIES[c.species].name; }

  function afterDamageChecks(){
    const player = activeCreature();
    const wild = state.battle.wild;
    if(wild.hp <= 0){
      const gained = wild.level * 8;
      pushLog(`${nameOf(wild)} fainted! ${nameOf(player)} gained ${gained} XP.`);
      const leveled = gainXp(player, gained);
      if(leveled) pushLog(`${nameOf(player)} grew to level ${player.level}!`);
      state.battle.wildDefeated = true;
      render();
      return true;
    }
    if(player.hp <= 0){
      pushLog(`${nameOf(player)} fainted!`);
      if(aliveTeam().length > 0){
        state.battle.awaitingSwitch = true;
      } else {
        pushLog(`All your Glowkin have fainted...`);
        state.battle.blackout = true;
      }
      render();
      return true;
    }
    return false;
  }

  function playerAction(kind, payload){
    if(!state.battle || state.battle.turnLock) return;
    const battle = state.battle;
    const player = activeCreature();
    const wild = battle.wild;

    if(battle.wildDefeated || battle.blackout || battle.justCaught) return;

    battle.turnLock = true;
    player.guarding = false;

    const resolveWildTurn = () => {
      if(wild.hp <= 0 || player.hp <= 0) return;
      const moveKey = SPECIES[wild.species].moves[rnd(0, SPECIES[wild.species].moves.length-1)];
      doDamage(wild, player, MOVES[moveKey]);
    };

    const playerFirst = player.spd >= wild.spd;

    const step2 = () => {
      if(afterDamageChecks()){ battle.turnLock = false; return; }
      battle.turnLock = false;
      render();
    };

    if(kind === 'move'){
      const move = MOVES[payload];
      const doPlayerHit = () => doDamage(player, wild, move);
      if(playerFirst){
        doPlayerHit();
        if(afterDamageChecks()){ battle.turnLock=false; return; }
        resolveWildTurn();
        step2();
      } else {
        resolveWildTurn();
        if(afterDamageChecks()){ battle.turnLock=false; return; }
        doPlayerHit();
        step2();
      }
    } else if(kind === 'catch'){
      if(state.orbs <= 0){ pushLog(`No Glimmer Orbs left!`); battle.turnLock=false; render(); return; }
      state.orbs -= 1;
      const sp = SPECIES[wild.species];
      const chance = clamp(sp.catch + (1 - hpPct(wild)) * 0.55, 0.05, 0.95);
      if(Math.random() < chance){
        pushLog(`Gotcha! ${nameOf(wild)} was caught!`);
        battle.justCaught = true;
        if(state.team.length < 6){
          state.team.push(makeCreature(wild.species, wild.level));
        } else {
          pushLog(`Team is full — ${nameOf(wild)} was noted in your log instead.`);
        }
        state.caughtLog[wild.species] = true;
        battle.turnLock = false;
        render();
      } else {
        pushLog(`${nameOf(wild)} broke free!`);
        resolveWildTurn();
        step2();
      }
    } else if(kind === 'run'){
      const chance = clamp(0.6 + (player.spd - wild.spd) * 0.02, 0.3, 0.95);
      if(Math.random() < chance){
        battle.turnLock = false;
        endBattle('Got away safely.');
        return;
      } else {
        pushLog(`Couldn't get away!`);
        resolveWildTurn();
        step2();
      }
    } else if(kind === 'switch'){
      const idx = payload;
      if(state.team[idx].hp <= 0){ battle.turnLock=false; return; }
      const [c] = state.team.splice(idx,1);
      state.team.unshift(c);
      pushLog(`Go, ${nameOf(c)}!`);
      battle.awaitingSwitch = false;
      resolveWildTurn();
      step2();
    }
  }

  function renderBattle(){
    const battle = state.battle;
    const player = activeCreature();
    const wild = battle.wild;
    const pSp = SPECIES[player.species];
    const wSp = SPECIES[wild.species];

    const fighterBlock = (c, sp, isEnemy) => `
      <div class="fighter-card ${isEnemy?'enemy':''}">
        <div class="name-row">${isEnemy?'':`<span class="badge badge-${sp.element}">${sp.element}</span>`}<strong>${sp.name}</strong><span class="lvl-tag">Lv${c.level}</span>${isEnemy?`<span class="badge badge-${sp.element}">${sp.element}</span>`:''}</div>
        <div class="hpbar-wrap"><div class="hpbar ${hpBarClass(c)}" style="width:${clamp(hpPct(c)*100,0,100)}%"></div></div>
        <div class="muted" style="font-size:11px; margin-top:2px;">${c.hp}/${c.maxHp} HP</div>
      </div>`;

    const stage = `
      <div class="stage">
        <div class="blob-wrap"><div class="aura aura-${pSp.element}"></div><div class="blob lg el-${pSp.element} ${player.hp<=0?'faint':''}" id="player-blob"></div></div>
        <div class="blob-wrap enemy"><div class="aura aura-${wSp.element}"></div><div class="blob lg el-${wSp.element} ${wild.hp<=0?'faint':''}" id="wild-blob"></div></div>
      </div>`;

    let actionsHtml = '';
    if(battle.blackout){
      actionsHtml = `<p>Your team blacks out and stumbles back to town...</p><button class="btn primary" id="btn-blackout-return">Return to Town</button>`;
    } else if(battle.justCaught){
      actionsHtml = `<button class="btn primary" id="btn-continue-caught">Continue exploring</button>`;
    } else if(battle.wildDefeated){
      actionsHtml = `<button class="btn primary" id="btn-continue-win">Continue exploring</button>`;
    } else if(battle.awaitingSwitch){
      const opts = state.team.map((c,i) => c.hp > 0 ? `<button class="btn small" data-switch="${i}">${nameOf(c)} (Lv${c.level})</button>` : '').join('');
      actionsHtml = `<p style="margin-top:0;">Choose your next Glowkin:</p><div class="row">${opts}</div>`;
    } else {
      const moveButtons = pSp.moves.map(mk => {
        const mv = MOVES[mk];
        const meta = mv.element === 'Guard' ? 'Braces, reduces next hit' : `${mv.element} · pow ${mv.power}`;
        return `<button class="btn move-btn" data-move="${mk}"><div class="mv-name">${mv.name}</div><div class="mv-meta">${meta}</div></button>`;
      }).join('');
      actionsHtml = `
        <div class="action-grid">${moveButtons}</div>
        <div class="row back-row">
          <button class="btn small" id="btn-catch" ${state.orbs<=0?'disabled':''}>✦ Catch (${state.orbs})</button>
          <button class="btn small" id="btn-switch">Switch</button>
          <button class="btn small" id="btn-run">Run</button>
        </div>`;
    }

    let switchPanel = '';
    if(state.battle.showSwitchMenu && !battle.awaitingSwitch){
      const opts = state.team.map((c,i) => c.hp > 0 && i !== 0 ? `<button class="btn small" data-switch="${i}">${nameOf(c)} (Lv${c.level})</button>` : '').join('');
      switchPanel = `<div class="row" style="margin-top:8px;">${opts || '<span class="muted" style="font-size:12px;">No other Glowkin available.</span>'} <button class="btn small" id="btn-cancel-switch">Cancel</button></div>`;
    }

    return `
      <div class="screen battle">
        <div class="battle-top">
          <div class="fighter-row">
            ${fighterBlock(player, pSp, false)}
            ${fighterBlock(wild, wSp, true)}
          </div>
          ${stage}
          <div class="battle-log">${battle.log.map(l=>`<div>${l}</div>`).join('')}</div>
        </div>
        <div class="actions">
          ${actionsHtml}
          ${switchPanel}
        </div>
      </div>`;
  }

  /* ============ TEAM SCREEN ============ */
  function renderTeam(){
    const rows = state.team.map((c,i) => {
      const sp = SPECIES[c.species];
      return `
        <div class="team-row ${i===0?'active':''}">
          <div class="blob-wrap"><div class="aura aura-${sp.element}"></div><div class="blob el-${sp.element}" style="width:56px;height:56px;"></div></div>
          <div style="flex:1;">
            <div class="row" style="justify-content:space-between; align-items:center;">
              <strong>${sp.name} ${i===0?'★ Active':''}</strong>
              <span class="badge badge-${sp.element}">${sp.element}</span>
            </div>
            <div class="stat-mini">Lv${c.level} · XP ${c.xp}/${xpNeeded(c.level)}</div>
            <div class="hpbar-wrap" style="margin-top:4px;"><div class="hpbar ${hpBarClass(c)}" style="width:${clamp(hpPct(c)*100,0,100)}%"></div></div>
            <div class="stat-mini" style="margin-top:4px;">HP ${c.hp}/${c.maxHp} · ATK ${c.atk} · DEF ${c.def} · SPD ${c.spd}</div>
          </div>
          ${i!==0 ? `<button class="btn small" data-set-active="${i}">Set Active</button>` : ''}
        </div>`;
    }).join('');
    return `
      <div class="screen">
        <div class="topbar">
          <h2 style="margin:0;">Your Glowkin</h2>
          <button class="btn small" id="btn-back-overworld">Back</button>
        </div>
        <div class="team-list">${rows}</div>
      </div>`;
  }

  /* ============ EVENT WIRING ============ */
  function attachHandlers(){
    const app = document.getElementById('app');

    const byId = (id) => document.getElementById(id);

    if(byId('btn-start')){
      byId('btn-start').onclick = () => { state.screen = 'starter'; render(); };
    }
    app.querySelectorAll('[data-starter]').forEach(el => {
      el.onclick = () => { state.starterPick = el.getAttribute('data-starter'); render(); };
    });
    if(byId('btn-confirm-starter')){
      byId('btn-confirm-starter').onclick = () => {
        state.team = [ makeCreature(state.starterPick, 5) ];
        state.screen = 'overworld';
        render();
      };
    }
    if(byId('btn-open-team')){ byId('btn-open-team').onclick = () => { state.screen = 'team'; render(); }; }
    if(byId('btn-back-overworld')){ byId('btn-back-overworld').onclick = () => { state.screen = 'overworld'; render(); }; }
    app.querySelectorAll('[data-set-active]').forEach(el => {
      el.onclick = () => {
        const idx = parseInt(el.getAttribute('data-set-active'),10);
        const [c] = state.team.splice(idx,1);
        state.team.unshift(c);
        render();
      };
    });

    app.querySelectorAll('[data-move]').forEach(el => {
      el.onclick = () => {
        const val = el.getAttribute('data-move');
        if(state.screen === 'overworld'){
          const map = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
          tryMove(map[val][0], map[val][1]);
        } else if(state.screen === 'battle'){
          playerAction('move', val);
        }
      };
    });

    if(byId('btn-catch')){ byId('btn-catch').onclick = () => playerAction('catch'); }
    if(byId('btn-run')){ byId('btn-run').onclick = () => playerAction('run'); }
    if(byId('btn-switch')){
      byId('btn-switch').onclick = () => { state.battle.showSwitchMenu = !state.battle.showSwitchMenu; render(); };
    }
    if(byId('btn-cancel-switch')){ byId('btn-cancel-switch').onclick = () => { state.battle.showSwitchMenu = false; render(); }; }
    app.querySelectorAll('[data-switch]').forEach(el => {
      el.onclick = () => playerAction('switch', parseInt(el.getAttribute('data-switch'),10));
    });

    if(byId('btn-continue-win')){ byId('btn-continue-win').onclick = () => endBattle(); }
    if(byId('btn-continue-caught')){ byId('btn-continue-caught').onclick = () => endBattle(); }
    if(byId('btn-blackout-return')){
      byId('btn-blackout-return').onclick = () => {
        state.team.forEach(c => c.hp = c.maxHp);
        state.pos = { x: state.lastTown.x, y: state.lastTown.y };
        endBattle();
      };
    }
  }

  document.addEventListener('keydown', (e) => {
    if(state.screen !== 'overworld') return;
    const map = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
    if(map[e.key]){ e.preventDefault(); tryMove(map[e.key][0], map[e.key][1]); }
  });

  render();
})();
</script>
</body>
</html>
